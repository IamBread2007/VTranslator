[package]
name = "mt-layout"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "0.2"

# The measure callback crosses the JS boundary as a Function; native builds never link it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
